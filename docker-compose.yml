services:
  polydash-weather:
    build: .
    image: polydash-weather:latest
    container_name: polydash-weather
    restart: unless-stopped
    ports:
      - "3001:3000"
    environment:
      - NODE_ENV=production
      - WD1_AI_TOKEN=${WD1_AI_TOKEN:-}
      - WD1_BASE_URL=${WD1_BASE_URL:-http://host.docker.internal:3000}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - archive-data:/app/data/archives

volumes:
  archive-data:

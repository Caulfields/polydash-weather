<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Weather Dashboard</title>
  <link rel="icon" type="image/x-icon" href="/favicon/favicon.ico">
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon/favicon-16x16.png">
  <link rel="apple-touch-icon" sizes="180x180" href="/favicon/apple-touch-icon.png">
  <link rel="manifest" href="/favicon/site.webmanifest">
  <link rel="stylesheet" href="/assets/css/index.css" />
</head>
<body>
  <main class="weather-layout">
    <section class="weather-panel">
      <div class="current-strip">
        <div>
          <span class="eyebrow">Observed now</span>
          <div class="temp-now" id="tempNow">--<span class="temp-unit">°C</span></div>
        </div>
        <div class="current-meta">
          <div>
            <span class="cf-label">Min today</span>
            <span class="cf-value" id="cfMin">--</span>
          </div>
          <div>
            <span class="cf-label">Max today</span>
            <span class="cf-value hot" id="cfMax">--</span>
          </div>
          <div>
            <span class="cf-label">Weather</span>
            <span class="cf-value" id="cfWeather">--</span>
          </div>
          <div>
            <span class="cf-label">Wind</span>
            <span class="cf-value" id="cfWind">--</span>
          </div>
        </div>
        <div class="current-status">
          <span class="current-time" id="londonTime">--:--:--</span>
          <span class="metar-updated" id="metarUpd">--</span>
        </div>
      </div>

      <div class="chart-section">
        <div class="section-header">
          <div>
            <span class="eyebrow">Observed and forecast</span>
            <h2 id="chartTitle">ZBAA Temperature Today</h2>
          </div>
          <span class="metar-raw" id="metarRaw">loading...</span>
          <span class="source-badge" id="omBadge">OM</span>
          <div class="om-switch" id="omSwitch">
            <button class="om-mode-btn active" id="omModeBest" type="button" onclick="setOmMode('best')">Best</button>
            <button class="om-mode-btn" id="omModeAvg" type="button" onclick="setOmMode('average')">Average</button>
          </div>
        </div>
        <div class="chart-wrap">
          <canvas id="tempChart"></canvas>
          <canvas id="tempChartOverlay"></canvas>
          <div class="chart-tooltip" id="chartTooltip">
            <div class="chart-tooltip-time" id="ttTime"></div>
            <div class="chart-tooltip-row">
              <span class="tooltip-key metar">METAR</span>
              <span class="chart-tooltip-temp" id="ttMetarTemp">--</span>
            </div>
            <div class="chart-tooltip-note" id="ttMetarNote"></div>
            <div class="chart-tooltip-row">
              <span class="tooltip-key forecast">Forecast</span>
              <span class="chart-tooltip-temp forecast" id="ttForecastTemp">--</span>
            </div>
            <div class="chart-tooltip-note" id="ttForecastNote"></div>
          </div>
        </div>
        <div class="legend-wrap" id="chartLegend"></div>
        <div class="om-loading" id="omLoading">Loading...</div>
        <div class="model-tools">
          <button class="rank-button" id="modelRankBtn" type="button" onclick="rankForecastModels()">Find best model</button>
          <button class="rank-button combo" id="modelComboRankBtn" type="button" onclick="rankForecastModelAverages()">Find best average</button>
          <span class="rank-status" id="modelRankStatus"></span>
        </div>
        <div class="model-dock" id="modelDock"></div>
      </div>
    </section>

    <aside class="city-panel" aria-label="City selection">
      <div class="city-panel-header">
        <span class="eyebrow">Cities</span>
        <h2>Switch location</h2>
      </div>
      <div class="city-search-wrap">
        <input class="city-search" id="citySearch" type="search" placeholder="Search city or code" autocomplete="off" />
      </div>
      <div class="city-list" id="cityList"></div>
    </aside>
  </main>

  <script src="/assets/js/dashboard/config.js"></script>
  <script src="/assets/js/dashboard/utils.js"></script>
  <script src="/assets/js/dashboard/metar-chart.js"></script>
  <script src="/assets/js/dashboard/openmeteo.js"></script>
  <script src="/assets/js/dashboard/city-boot.js"></script>
</body>
</html>

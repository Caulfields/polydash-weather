<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Weather Dashboard</title>
  <link rel="icon" type="image/x-icon" href="/favicon/favicon.ico">
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon/favicon-16x16.png">
  <link rel="apple-touch-icon" sizes="180x180" href="/favicon/apple-touch-icon.png">
  <link rel="manifest" href="/favicon/site.webmanifest">
  <link rel="stylesheet" href="/assets/css/index.css" />
</head>
<body>
  <main class="weather-layout">
    <section class="weather-panel">
      <div class="current-strip">
        <div style="text-align:center">
          <div class="temp-now" id="tempNow">--<span class="temp-unit">°C</span></div>
        </div>
        <div class="current-meta">
          <div>
            <span class="cf-label">Min today</span>
            <span class="cf-value" id="cfMin">--</span>
          </div>
          <div>
            <span class="cf-label">Max today</span>
            <span class="cf-value hot" id="cfMax">--</span>
          </div>
          <div>
            <span class="cf-label">Weather</span>
            <span class="cf-value" id="cfWeather">--</span>
          </div>
          <div>
            <span class="cf-label">Wind</span>
            <span class="cf-value" id="cfWind">--</span>
          </div>
          <div>
            <span class="cf-label">Code</span>
            <span class="cf-value" id="cfWeatherCode" style="display:none">--</span>
          </div>
        </div>
        <div class="current-status">
          <span class="current-time" id="londonTime">--:--:--</span>
          <span class="metar-updated" id="metarUpd">--</span>
          <span class="model-updated" id="modelUpd" style="display:none"></span>
        </div>
      </div>

      <div class="chart-section">
        <div class="section-header">
          <div>
            <span class="eyebrow">Forecast</span>
            <h2 id="chartTitle">ZBAA</h2>
          </div>
          <div class="forecast-day-switch" id="forecastDaySwitch" aria-label="Forecast day">
            <button class="forecast-day-btn active" id="forecastDayToday" type="button" aria-pressed="true" onclick="setForecastDay('today')">Today</button>
            <button class="forecast-day-btn" id="forecastDayTomorrow" type="button" aria-pressed="false" onclick="setForecastDay('tomorrow')">Tomorrow</button>
          </div>
          <button class="metar-toggle" id="metarToggle" type="button" onclick="toggleMetarRaw()" title="Toggle METAR">METAR</button>
          <span class="metar-raw" id="metarRaw">loading...</span>
          <button class="copy-temp-button" id="copyTempBtn" type="button" onclick="copyForecastMaxTemp()" title="Copy max temp">📋</button>
          <span class="forecast-max-temp" id="forecastMaxTemp"></span>
          <span class="weather-tag" id="tagWind" style="display:none">Strong wind</span>
          <span class="weather-tag" id="tagRain" style="display:none">Rain</span>
          <span class="weather-tag" id="tagCloud" style="display:none"></span>
          <span class="source-badge" id="omBadge">OM</span>
          <div class="om-switch" id="omSwitch">
            <button class="om-mode-btn active" id="omModeBest" type="button" onclick="setOmMode('best')">Best</button>
            <button class="om-mode-btn" id="omModeAvg" type="button" onclick="setOmMode('average')">Average</button>
          </div>
        </div>
        <div class="chart-wrap">
          <canvas id="tempChart"></canvas>
          <canvas id="tempChartOverlay"></canvas>
          <div class="chart-tooltip" id="chartTooltip">
            <div class="chart-tooltip-time" id="ttTime"></div>
            <div class="chart-tooltip-row">
              <span class="tooltip-key metar">METAR</span>
              <span class="chart-tooltip-temp" id="ttMetarTemp">--</span>
            </div>
            <div class="chart-tooltip-note" id="ttMetarNote"></div>
            <div class="chart-tooltip-row tooltip-row-wind" id="ttMetarWindRow">
              <span class="chart-tooltip-wind" id="ttMetarWind">--</span>
            </div>
            <div class="chart-tooltip-row">
              <span class="tooltip-key forecast">Forecast</span>
              <span class="chart-tooltip-temp forecast" id="ttForecastTemp">--</span>
            </div>
            <div class="chart-tooltip-note" id="ttForecastNote"></div>
            <div class="chart-tooltip-note" id="ttForecastWmo" style="display:none"></div>
            <div class="chart-tooltip-row tooltip-row-wind" id="ttForecastWindRow">
              <span class="chart-tooltip-wind" id="ttForecastWind">--</span>
            </div>
          </div>
        </div>
        <div class="legend-wrap" id="chartLegend"></div>
        <div class="om-loading" id="omLoading">Loading...</div>
        <div class="model-tools">
          <button class="rank-button save-average" id="modelSaveAverageBtn" type="button" onclick="saveLatestAverageModel()">Save average</button>
          <button class="rank-button daytime" id="modelRankDayBtn" type="button" onclick="rankForecastModelsFromEight()">Best model from 08</button>
          <button class="rank-button daytime combo" id="modelComboRankDayBtn" type="button" onclick="rankForecastModelAveragesFromEight()">Best average from 08</button>
          <button class="rank-button daytime combo gear" id="modelSettingsBtn" type="button" onclick="openCityModelSettings()" title="Model settings">⚙</button>
          <span class="rank-status" id="modelRankStatus"></span>
          <div class="city-model-settings" id="cityModelSettingsPanel" style="display:none">
            <span class="city-model-settings-title">Settings for <strong id="settingsCityName"></strong></span>
            <select class="city-model-settings-select" id="settingsBasicModel" aria-label="Basic model"></select>
            <select class="city-model-settings-select" id="settingsAdditionalModel" aria-label="Additional model"></select>
            <select class="city-model-settings-select" id="settingsTestModel" aria-label="Test model"></select>
            <button class="city-model-settings-save" type="button" onclick="saveCityModelSettings()">Save</button>
            <button class="city-model-settings-close" type="button" onclick="closeCityModelSettings()">✕</button>
          </div>
        </div>
        <div class="temperature-finder">
          <div class="active-city-list-controls" id="activeCityListControls" aria-label="Active city lists"></div>
          <input class="temperature-finder-input" id="targetTempInput" type="text" inputmode="decimal" placeholder="12C" autocomplete="off" oninput="setTemperatureHighlight(this.value)" />
          <button class="temperature-finder-clear" id="targetTempClear" type="button" onclick="clearTemperatureHighlight()">Clear</button>
          <span class="temperature-finder-status" id="targetTempStatus"></span>
        </div>
        <div class="model-dock" id="modelDock"></div>

      </div>

      <div class="location-notes" id="locationNotes">
        <button class="location-notes-toggle" id="locationNotesToggle" type="button" aria-expanded="true" onclick="toggleLocationNotes()">
          <span id="locationNotesTitle">Location notes</span>
          <span class="location-notes-toggle-text" id="locationNotesToggleText">Hide</span>
        </button>
        <div class="location-notes-body" id="locationNotesBody">
          <textarea class="location-notes-input" id="locationNotesInput" rows="4" placeholder="Add notes for this location" oninput="updateActiveCityNote(this.value)"></textarea>
        </div>
      </div>
    </section>

    <aside class="city-panel" aria-label="City selection">
      <div class="city-search-wrap">
        <input class="city-search" id="citySearch" type="search" placeholder="Search city or code" autocomplete="off" />
      </div>
      <div class="city-filter-bar">
        <button class="city-filter-btn" id="cityFavoritesFilter" type="button" aria-pressed="false" onclick="toggleCityFilter('favorite')">
          <span class="favorite-icon" aria-hidden="true">&#9734;</span>
        </button>
        <button class="city-filter-btn green" id="cityGreensFilter" type="button" aria-pressed="false" onclick="toggleCityFilter('green')">
          <span class="favorite-icon" aria-hidden="true">&#9679;</span>
        </button>
        <button class="city-filter-btn red" id="cityRedsFilter" type="button" aria-pressed="false" onclick="toggleCityFilter('red')">
          <span class="favorite-icon" aria-hidden="true">&#9679;</span>
        </button>
        <button class="city-filter-btn sort" id="citySortBtn" type="button" aria-pressed="false" onclick="toggleCitySort()">
          <span class="sort-icon" aria-hidden="true">↕</span>
        </button>
      </div>
      <div class="city-list" id="cityList"></div>
    </aside>
  </main>

  <script src="/assets/js/dashboard/config.js"></script>
  <script src="/assets/js/dashboard/utils.js"></script>
  <script src="/assets/js/dashboard/metar-chart.js?v=wind-6"></script>
  <script src="/assets/js/dashboard/openmeteo.js"></script>
  <script src="/assets/js/dashboard/city-boot.js"></script>
</body>
</html>
